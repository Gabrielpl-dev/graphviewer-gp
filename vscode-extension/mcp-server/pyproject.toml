[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphviewer-mcp"
version = "0.1.0"
description = "Servidor MCP: expõe o langgraph dev (grafo/execução/nós) como tools pra agentes"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
graphviewer-mcp = "graphviewer_mcp.server:main"

name: VS Code Extension

on:
  push:
    branches: [master]
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"
  pull_request:
    paths:
      - "vscode-extension/**"
      - ".github/workflows/vscode-extension.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - run: npm ci

      # npm test já roda `tsc -p .` (strict) antes dos testes — é o que faz o papel de lint
      # aqui, não tem ESLint configurado (não valeria a complexidade só pra isso).
      - run: npm test

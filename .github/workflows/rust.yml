name: Rust (app/)

on:
  push:
    branches: [master]
    paths:
      - "app/**"
      - ".github/workflows/rust.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/rust.yml"

jobs:
  build-test-lint:
    # windows-latest porque eframe/egui (winit) evita a dependência extra de libs X11/GTK que
    # runners Linux exigem só pra linkar uma GUI — e é o ambiente real de desenvolvimento do app.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app

      - name: cargo build
        run: cargo build --workspace

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
